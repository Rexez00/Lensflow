services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lensflow
      POSTGRES_PASSWORD: lensflow
      POSTGRES_DB: lensflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
